name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: dist is committed and up to date
        run: |
          npm run build
          git diff --exit-code -- dist
